# Toolnook Backend — Stellar Horizon Gateway Configuration
#
# Copy to config.yaml and edit for your environment.

port: 8080
host: 0.0.0.0
logging: true

# Stellar network configuration
stellar:
  network: public              # public or testnet
  horizonUrl: https://horizon.stellar.org
  sorobanUrl: https://soroban-rpc.stellar.org
  cacheTtl: 10000              # cache Horizon GET responses for 10 seconds

# Global rate limit — keep under Horizon's limits
globalRateLimit:
  capacity: 100
  refillRate: 50

healthCheckPath: /health
metricsPath: /metrics

routes:
  # Stellar Horizon — proxy with rate limiting and circuit breaker
  - id: horizon
    path: /
    pathPrefix: true
    methods: [GET]
    upstreams:
      - name: stellar-horizon
        url: https://horizon.stellar.org
        timeout: 30000
    rateLimit:
      capacity: 50
      refillRate: 25
      key: ip
    circuitBreaker:
      threshold: 5
      resetTimeout: 30000
      failureStatuses: [500, 502, 503, 504]
    logging: true

  # Soroban RPC — separate circuit breaker for smart contract calls
  - id: soroban
    path: /soroban
    pathPrefix: true
    methods: [POST]
    upstreams:
      - name: soroban-rpc
        url: https://soroban-rpc.stellar.org
    circuitBreaker:
      threshold: 3
      resetTimeout: 15000

  # Local Horizon instance (for development)
  - id: local-horizon
    path: /local
    pathPrefix: true
    upstreams:
      - name: local-horizon
        url: http://localhost:8000
    rateLimit:
      capacity: 100
      refillRate: 50
