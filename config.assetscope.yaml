# Local AssetScope integration: browser UI -> gateway -> snapshot API.

port: 8080
host: 127.0.0.1
logging: true

healthCheckPath: /health
metricsPath: /metrics

routes:
  - id: assetscope-api
    path: /api/assetscope
    pathPrefix: true
    methods: [GET, POST]
    upstreams:
      - name: contracts-assetscope-api
        url: http://127.0.0.1:8091
        timeout: 10000
    rateLimit:
      capacity: 30
      refillRate: 10
      key: ip
    circuitBreaker:
      threshold: 5
      resetTimeout: 15000

  - id: assetscope-frontend
    path: /
    pathPrefix: true
    methods: [GET]
    upstreams:
      - name: assetscope-dashboard
        url: http://127.0.0.1:8090
        timeout: 5000
